        url: "https://dadosabertos.aneel.gov.br/dataset/2594ebad-1306-49d1-9f30-ded144acca87/resource/b0418edb-038d-4fde-b624-c318d376a734/download/ctr-curvas-carga-consumidor-tipo.csv"
