# Configuração central de fontes: pontos de partida conhecidos, endpoints de
# descoberta e janelas de rechecagem. Nenhuma URL de download final é usada
# diretamente pelo pipeline sem antes ser confirmada por descoberta dinâmica
# (CKAN package_show ou scraping da página), exceto como fallback documentado.

recheck_windows:
  ons: 90d
  ccee: 6m
  epe: 6m
  samp: 6m
  aneel_ctr: 365d

user_agent: "rj-energy-datalake/0.1 (+https://github.com/EstevezCodando/rj-energy-datalake; contato: dados publicos)"

http:
  timeout_seconds: 30
  max_retries: 5
  backoff_base_seconds: 1.0
  rate_limit_seconds: 0.5

sources:
  aneel_ctr:
    dataset_page: "https://dadosabertos.aneel.gov.br/dataset/ctr-curva-de-carga"
    package_id: "2594ebad-1306-49d1-9f30-ded144acca87"
    ckan_base: "https://dadosabertos.aneel.gov.br"
    ckan_package_show: "https://dadosabertos.aneel.gov.br/api/3/action/package_show?id=2594ebad-1306-49d1-9f30-ded144acca87"
    known_resources:
