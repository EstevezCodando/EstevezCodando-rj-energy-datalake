[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rj-energy-datalake"
version = "0.1.0"
description = "Pipeline de descoberta, coleta, versionamento, validação e consolidação de dados públicos de carga e consumo elétrico do Rio de Janeiro (ANEEL, ONS, CCEE, EPE, SAMP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EstevezCodando" }]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "holidays>=0.50",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]
publish = [
    "huggingface_hub>=0.24",
]

[project.scripts]
rj-energy = "rj_energy.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "projections/ev_demand_2035/tests"]
pythonpath = ["src", "projections/ev_demand_2035/src"]
